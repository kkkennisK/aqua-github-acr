trigger:
- poc

resources:
- repo: self

# variables:
#   tag: '$(Build.BuildId)'

stages:

- stage: Build
  displayName: Build, Scan, Push Image

  jobs:
  - job: Build
    displayName: Build, Scan, Push Image
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: CmdLine@2
      displayName: 'Show ACR Registry'
      inputs:
        script: 'echo "ACR Registry: $(acr_registry)"'
  
    - task: Docker@2
      displayName: Build Image
      inputs:
        command: build
        repository: $(ACR_REGISTRY)/poc-demo
        tags: latest
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        arguments: |
          --label com.azure.dev.image.system.teamfoundationcollectionuri=https://dev.azure.com/cloudadmin0193/
          --label com.azure.dev.image.system.teamproject=aqua-devops-poc
          --label com.azure.dev.image.build.repository.name=kkkennisK/aqua-github-acr
          --label com.azure.dev.image.build.sourceversion=25947c51f7e653db006d8741aaa7c2ae1598cb1f
          --label com.azure.dev.image.build.repository.uri=https://github.com/kkkennisK/aqua-github-acr
          --label com.azure.dev.image.build.sourcebranchname=poc
          --label com.azure.dev.image.build.definitionname=kkkennisK.aqua-github-acr
          --label com.azure.dev.image.build.buildnumber=20250210.10
          --label com.azure.dev.image.build.builduri=vstfs:///Build/Build/196
          --label image.base.ref.name=python:3.8-slim-buster
          --label image.base.digest=sha256:8799b0564103a9f36cfb8a8e1c562e11a9a6f2e3bb214e2adc23982b36a04511
    - task: CmdLine@2
      displayName: Pull Aqua Scanner Image
      inputs: 
        script: |-
          docker image ls 
          docker login registry.aquasec.com -u $(AQUA_USER) -p $(AQUA_PASSWORD)
          docker pull registry.aquasec.com/scanner:2022.4
    - task: aquasecScanner@4
      displayName: Aqua Image Scanner
      inputs:
        image: $(ACR_REGISTRY)/poc-demo:latest
        register: false
        hideBase: false
        showNegligible: false
        scanner: 'registry.aquasec.com/scanner:2022.4'
        connection: 'pos-devops'
        runOptions: ' -e BUILD_JOB_NAME=$(Build.Repository.Name)'

    - task: CmdLine@2
      displayName: Push Image to ACR
      inputs: 
        script: |-
          docker login -u systexacr -p $(ACR_PASSWORD) systexacr.azurecr.io
          docker push $(ACR_REGISTRY)/poc-demo:latest